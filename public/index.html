<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeff — interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6ECE7; --surface:#F6F8F5; --ink:#13231D; --muted:#5B6B63; --line:#D2DBD4;
  --jeff:#0D3A2B; --jeff2:#175340; --mint:#86E3B5; --gold:#E2B24A; --flag:#D4472F; --onjeff:#EAF6EF;
  --frame:#0B1411;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A1310; --surface:#111D18; --ink:#E3ECE6; --muted:#8FA198; --line:#22332B; --jeff:#0B3022; --jeff2:#145039; --frame:#000;
}}
:root[data-theme="dark"]{--paper:#0A1310; --surface:#111D18; --ink:#E3ECE6; --muted:#8FA198; --line:#22332B; --jeff:#0B3022; --jeff2:#145039; --frame:#000;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--mint); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* stage */
.stage{display:flex; gap:40px; justify-content:center; align-items:flex-start; padding:28px 20px 40px; min-height:100%}
.phone{position:relative; width:390px; max-width:100%; height:min(844px, calc(100vh - 56px)); min-height:640px; background:var(--surface); border:10px solid var(--frame); border-radius:48px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 40px 80px -40px rgba(13,58,43,.55)}
.notch{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:110px; height:30px; background:var(--frame); border-radius:20px; z-index:30}
.screen{flex:1; overflow-y:auto; overflow-x:hidden; position:relative}
.screen::-webkit-scrollbar{width:0}

/* controls */
.controls{width:300px; position:sticky; top:28px; font-size:14px}
.controls h2{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:20px; margin:0 0 4px}
.controls .lede{color:var(--muted); margin:0 0 20px}
.cgroup{border-top:1px solid var(--line); padding:14px 0 16px}
.cgroup h3{font-size:13px; font-weight:600; color:var(--muted); margin:0 0 10px}
.pbtn{display:block; width:100%; text-align:left; background:transparent; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px}
.pbtn b{display:block; font-weight:600}
.pbtn span{color:var(--muted); font-size:13px}
.pbtn[aria-pressed="true"]{border-color:var(--jeff2); background:var(--surface); box-shadow:inset 3px 0 0 var(--jeff2)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.sbtn{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:13px}
.ebtn{display:block; width:100%; text-align:left; background:var(--jeff); color:var(--onjeff); border:0; border-radius:12px; padding:11px 13px; margin-bottom:8px; font-weight:500}
.ebtn small{display:block; opacity:.7; font-weight:400; font-size:12px}
.toggle{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.status{font-size:12px; color:var(--muted)}
.status i{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:1px}
.status.on i{background:#2FB27A}
.hidebtn{position:fixed; right:14px; bottom:14px; z-index:50; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-size:12px; color:var(--muted)}
body.clean .controls{display:none}

/* shared screen bits */
.pad{padding:58px 22px 24px}
.title{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:28px; line-height:1.1; letter-spacing:-.01em; margin:0 0 8px}
.sub{color:var(--muted); margin:0 0 20px}
.primary{display:block; width:100%; border:0; border-radius:16px; background:var(--jeff); color:var(--onjeff); padding:16px; font-weight:600; font-size:16px}
.primary[disabled]{opacity:.35; cursor:default}
.footer{position:sticky; bottom:0; padding:12px 22px 18px; background:linear-gradient(to top, var(--surface) 70%, transparent)}

/* welcome */
.welcome{height:100%; display:flex; flex-direction:column; background:var(--jeff); color:var(--onjeff)}
.welcome .top{flex:1; padding:80px 26px 0; display:flex; flex-direction:column}
.wordmark{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:112px; line-height:.85; letter-spacing:-.045em; margin:0}
.welcome p.tag{font-size:19px; line-height:1.35; max-width:290px; margin:22px 0 0; opacity:.92}
.bigwave{margin-top:auto; height:150px; display:flex; align-items:center; gap:5px; padding-bottom:30px}
.bigwave span{flex:1; background:var(--mint); border-radius:4px; opacity:.85; animation:breathe 2.4s ease-in-out infinite}
.welcome .bottom{padding:0 22px 26px}
.welcome .primary{background:var(--mint); color:var(--jeff)}
.fine{font-size:12px; opacity:.6; text-align:center; margin:12px 0 0}
@keyframes breathe{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

/* connect */
.search{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; color:var(--muted); margin-bottom:18px; background:var(--paper)}
.search input{border:0; background:transparent; flex:1; font:inherit; color:var(--ink); outline:none}
.banks{list-style:none; margin:0; padding:0}
.bank{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.logo{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-weight:700; font-size:14px; color:#fff; flex:none}
.bank .nm{flex:1; min-width:0}
.bank .nm b{display:block; font-weight:600}
.bank .nm span{font-size:13px; color:var(--muted)}
.cbtn{border:1px solid var(--ink); background:transparent; border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600}
.cbtn.done{border-color:transparent; color:#2FB27A}
.cbtn.busy{border-color:var(--line); color:var(--muted)}
.more{font-size:13px; color:var(--muted); margin:14px 0 0}

/* state */
.lead{font-family:"Bricolage Grotesque",sans-serif; font-size:23px; line-height:1.22; font-weight:500; letter-spacing:-.01em; margin:0 0 22px}
.lead em{font-style:normal; font-weight:700}
.group h4{font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 2px; display:flex; justify-content:space-between}
.acct{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.acct .logo{width:32px; height:32px; font-size:12px; border-radius:9px}
.acct .nm{flex:1; min-width:0}
.acct .nm b{display:block; font-weight:500; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.acct .nm span{font-size:12px; color:var(--muted)}
.acct .bal{text-align:right; font-weight:600}
.acct .bal small{display:block; font-weight:400; font-size:12px; color:var(--muted)}
.neg{color:var(--flag)}
.hl{animation:flash 1.6s ease}
@keyframes flash{0%{background:rgba(134,227,181,.0)}25%{background:rgba(134,227,181,.35)}100%{background:rgba(134,227,181,0)}}

/* plan */
.progress{display:flex; gap:4px; margin:0 0 18px}
.progress i{flex:1; height:4px; border-radius:2px; background:var(--line)}
.progress i.ok{background:var(--jeff2)} .progress i.cur{background:var(--mint)}
.moves{list-style:none; margin:0; padding:0; counter-reset:m}
.move{position:relative; padding:14px 0 14px 40px; border-bottom:1px solid var(--line); color:var(--muted); transition:color .3s}
.move::before{counter-increment:m; content:counter(m); position:absolute; left:0; top:14px; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:12px; font-weight:600}
.move b{display:block; font-weight:600; font-size:15px}
.move .d{font-size:13px; display:none}
.move .tag{display:inline-block; font-size:12px; font-weight:600; margin-top:4px}
.move.current{color:var(--ink)}
.move.current .d,.move.approved .d,.move.adjusted .d{display:block}
.move.current::before{background:var(--mint); border-color:var(--mint); color:var(--jeff)}
.move.current{background:linear-gradient(90deg, rgba(134,227,181,.16), transparent 80%); margin:0 -22px; padding-left:62px; padding-right:22px}
.move.current::before{left:22px}
.move.approved,.move.adjusted{color:var(--ink)}
.move.approved::before,.move.adjusted::before{content:"✓"; background:var(--jeff2); border-color:var(--jeff2); color:#fff}
.move.declined b{text-decoration:line-through}
.move .rec{font-size:13px; color:var(--jeff2); font-weight:600}

/* home */
.hhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px}
.hhead .hi{color:var(--muted)}
.hhead .mk{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:22px; letter-spacing:-.03em}
.safe .lbl{margin:0; color:var(--muted)}
.safe .big{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:64px; letter-spacing:-.035em; line-height:1; margin:4px 0}
.safe .small{margin:0 0 26px; color:var(--muted); font-size:14px}
.hsec{margin-bottom:26px}
.hsec h3{font-size:14px; font-weight:600; margin:0 0 10px}
.split{display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px}
.split i{display:block; height:100%; transition:flex-grow .6s}
.legend{list-style:none; padding:0; margin:10px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:13px}
.legend li{display:flex; align-items:center; gap:7px}
.legend li i{width:9px; height:9px; border-radius:3px; flex:none}
.legend li span{margin-left:auto; font-weight:600}
.handling,.activity{list-style:none; margin:0; padding:0}
.handling li{padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.handling li span{display:block; color:var(--muted); font-size:13px}
.activity li{display:flex; gap:10px; padding:9px 0; font-size:13px; border-bottom:1px solid var(--line)}
.activity li time{color:var(--muted); width:52px; flex:none}
.activity li.new{animation:flash 1.8s ease}
.thread .msg{margin:10px 0}
.thread .me{text-align:right}
.thread .me span{display:inline-block; background:var(--paper); border-radius:14px 14px 4px 14px; padding:8px 12px; font-size:14px}
.thread .jf{font-size:14px}
.chart{background:var(--paper); border-radius:14px; padding:12px; margin-top:8px}
.chart h5{margin:0 0 8px; font-size:13px; font-weight:600}
.chart svg{display:block; width:100%; height:auto}
.chart text{fill:var(--ink); font-family:inherit}
.chart .mt{fill:var(--muted)}

/* Jeff dock */
.dock{background:var(--jeff); color:var(--onjeff); padding:12px 16px 14px; border-radius:24px 24px 0 0; flex:none; display:none}
.dock.show{display:block}
.jrow{display:flex; gap:12px; align-items:flex-start}
.wave{width:44px; height:44px; border-radius:50%; background:var(--jeff2); display:flex; align-items:center; justify-content:center; gap:3px; flex:none}
.wave span{width:3px; height:18px; background:var(--mint); border-radius:2px; transform:scaleY(.25); transition:transform .2s}
.speaking .wave span,.wave.speaking span{animation:talk .5s ease-in-out infinite alternate}
.wave span:nth-child(2){animation-delay:.12s!important}.wave span:nth-child(3){animation-delay:.24s!important}.wave span:nth-child(4){animation-delay:.08s!important}.wave span:nth-child(5){animation-delay:.3s!important}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.lines{flex:1; min-width:0}
.who{font-size:12px; opacity:.6; margin:0 0 2px}
.said{font-size:15.5px; line-height:1.4; margin:0; max-height:120px; overflow-y:auto; min-height:22px}
.said.thinking{opacity:.6}
.you{font-size:13px; opacity:.6; margin:6px 0 0; min-height:0}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 0}
.chip{background:transparent; border:1px solid rgba(234,246,239,.35); color:var(--onjeff); border-radius:999px; padding:7px 13px; font-size:13.5px}
.chip:first-child{background:var(--mint); color:var(--jeff); border-color:var(--mint); font-weight:600}
.ask{display:flex; gap:8px; margin-top:10px; align-items:center}
.ask input{flex:1; min-width:0; background:rgba(255,255,255,.08); border:1px solid rgba(234,246,239,.18); border-radius:999px; padding:10px 14px; color:var(--onjeff); font:inherit; font-size:14px; outline:none}
.ask input::placeholder{color:rgba(234,246,239,.5)}
.mic,.send{width:40px; height:40px; border-radius:50%; border:0; background:var(--jeff2); color:var(--onjeff); display:grid; place-items:center; flex:none}
.mic.live{background:var(--flag)}
.send{background:var(--mint); color:var(--jeff)}

/* overlays */
.call{position:absolute; inset:0; z-index:40; background:var(--jeff); color:var(--onjeff); display:none; flex-direction:column; padding:70px 22px 22px}
.call.show{display:flex}
.call .cname{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:56px; letter-spacing:-.04em; margin:0; line-height:1}
.call .cstat{opacity:.7; margin:6px 0 0}
.call .cwave{margin:40px auto 0; width:120px; height:120px; border-radius:50%; background:var(--jeff2); display:flex; align-items:center; justify-content:center; gap:5px}
.call .cwave span{width:5px; height:44px; background:var(--mint); border-radius:3px; transform:scaleY(.2)}
.call.ringing .cwave{animation:ring 1.2s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(134,227,181,.5)}50%{box-shadow:0 0 0 22px rgba(134,227,181,0)}}
.call.speaking .cwave span{animation:talk .45s ease-in-out infinite alternate}
.call .cwave span:nth-child(2){animation-delay:.1s}.call .cwave span:nth-child(3){animation-delay:.22s}.call .cwave span:nth-child(4){animation-delay:.05s}.call .cwave span:nth-child(5){animation-delay:.28s}
.call .ctext{margin-top:auto}
.call .said{max-height:170px; font-size:17px}
.callbtns{display:flex; justify-content:space-around; margin-top:24px}
.cb{width:66px; height:66px; border-radius:50%; border:0; color:#fff; font-size:13px; font-weight:600}
.cb.no{background:var(--flag)} .cb.yes{background:#2FB27A}
.endcall{margin-top:12px; background:var(--flag); color:#fff; border:0; border-radius:999px; padding:10px; width:100%; font-weight:600}

.banner{position:absolute; left:10px; right:10px; top:44px; z-index:35; background:var(--surface); color:var(--ink); border-radius:18px; padding:12px 14px; box-shadow:0 18px 40px -12px rgba(0,0,0,.35); transform:translateY(-140%); transition:transform .45s cubic-bezier(.2,.9,.3,1.2); cursor:pointer; border:1px solid var(--line)}
.banner.show{transform:none}
.banner .bt{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:3px}
.banner b{font-weight:600}
.banner p{margin:0; font-size:14px}


/* v2 additions */
.datepill{font-size:12px; background:var(--paper); border-radius:999px; padding:3px 10px; color:var(--muted)}
.worth{display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--jeff); color:var(--onjeff); border-radius:16px; padding:14px 16px; margin:0 0 26px; border:0; width:100%; text-align:left}
.worth b{font-family:"Bricolage Grotesque",sans-serif; font-size:24px; letter-spacing:-.02em; display:block; line-height:1.1}
.worth span{font-size:13px; opacity:.75}
.worth em{font-style:normal; font-size:13px; color:var(--mint); white-space:nowrap}
.found{list-style:none; margin:0; padding:0}
.found li{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.found li time{color:var(--muted); width:46px; flex:none}
.found li span{margin-left:auto; font-weight:600; color:var(--jeff2); white-space:nowrap}
.found li.new{animation:flash 1.8s ease}
.roibig{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:72px; letter-spacing:-.045em; line-height:.95; margin:4px 0 14px}
.roirows{list-style:none; margin:6px 0 0; padding:0}
.roirows li{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px}
.roirows li div{flex:1; min-width:0}
.roirows li small{display:block; color:var(--muted); font-size:12.5px}
.roirows li b{font-weight:600; white-space:nowrap}
.roirows li.skip{color:var(--muted)} .roirows li.skip b{text-decoration:line-through; font-weight:400}
.roirows li.pend b{color:var(--muted); font-weight:500}
.fineprint{font-size:12px; color:var(--muted); margin:16px 0 0}
.incomerow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.incomerow .nm{flex:1} .incomerow .nm b{display:block; font-weight:500; font-size:14px} .incomerow .nm span{font-size:12px; color:var(--muted)}
.incomerow .bal{font-weight:600; color:#2FB27A}
.ffbtn{display:block; width:100%; background:var(--mint); color:var(--jeff); border:0; border-radius:12px; padding:12px 13px; margin-bottom:10px; font-weight:600; text-align:left}
.ffbtn small{display:block; font-weight:400; font-size:12px; opacity:.8}


/* v3 additions */
.lrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; transition:background .3s}
.lrow .nm{flex:1; min-width:0}
.lrow .nm small{display:block; font-size:12px; color:var(--muted)}
.lrow .amt{text-align:right; font-weight:600; white-space:nowrap}
.lrow .amt s{color:var(--muted); font-weight:400; margin-right:6px}
.lrow .tg{font-size:11.5px; font-weight:600; border-radius:6px; padding:2px 6px; margin-left:6px}
.tg.trim{background:rgba(134,227,181,.3); color:var(--jeff2)} .tg.prot{background:rgba(226,178,74,.25); color:#9A6B0C}
.lrow.focus{background:rgba(134,227,181,.18); margin:0 -22px; padding-left:22px; padding-right:22px}
.cardbox{background:var(--paper); border-radius:14px; padding:12px 14px; font-size:13.5px; margin:0 0 6px}
.cardbox b{font-weight:600}
.totals{display:flex; gap:10px; margin-bottom:10px}
.totals div{flex:1; background:var(--paper); border-radius:12px; padding:9px 12px}
.totals small{display:block; font-size:12px; color:var(--muted)}
.totals b{font-family:"Bricolage Grotesque",sans-serif; font-size:20px; font-weight:700}
.totals b.neg{color:var(--flag)}
.goals{list-style:none; margin:0; padding:0}
.goals li{padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.goals li .gt{display:flex; justify-content:space-between; font-weight:500}
.goals li small{display:block; color:var(--muted); font-size:12.5px; margin-top:2px}
.bar{height:6px; border-radius:3px; background:var(--line); margin-top:7px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--jeff2); border-radius:3px; transition:width .6s}

@media (max-width:760px){
  .stage{flex-direction:column; align-items:center; padding:0 0 30px; gap:24px}
  .phone{width:100%; border:0; border-radius:0; height:100vh; height:100dvh; min-height:0; box-shadow:none}
  .notch{display:none}
  .controls{position:static; width:100%; max-width:420px; padding:0 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="banner" id="banner"></div>
    <div class="screen" id="screen"></div>
    <div class="dock" id="dock">
      <div class="jrow">
        <div class="wave" id="dwave"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="lines">
          <p class="who">Jeff</p>
          <p class="said" id="said" aria-live="polite"></p>
          <p class="you" id="you"></p>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <form class="ask" id="ask" autocomplete="off">
        <button type="button" class="mic" id="mic" aria-label="Talk to Jeff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <input id="askin" placeholder="Talk to Jeff" aria-label="Message Jeff">
        <button class="send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
    </div>
    <div class="call" id="call">
      <p class="cname">Jeff</p>

const r10 = n => Math.round(n / 10) * 10;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FV10 = 13.816;
const PPM = 26 / 12;                 // paychecks per month
const perPay = m => m / PPM;         // monthly → per paycheck
const monthly = pp => pp * PPM;      // per paycheck → monthly
const txt = v => typeof v === "function" ? v() : v;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const parseMoney = t => { const m = String(t).replace(/,/g, "").match(/\$\s*(\d+(?:\.\d+)?)\s*(k)?|(\d{2,6}(?:\.\d+)?)\s*(k|dollars|bucks)?/i); if (!m) return null; let n = parseFloat(m[1] || m[3]); if ((m[2] || m[4] || "").toLowerCase() === "k") n *= 1000; return n; };
const WORDN = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,a:1,an:1};
function parseMonths(t){ const m = String(t).toLowerCase().match(/(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|a|an)\s*(month|week|year)/); if (!m) return null; const n = WORDN[m[1]] || parseInt(m[1]); return m[2] === "week" ? n / 4.3 : m[2] === "year" ? n * 12 : n; }

/* ---- card payoff calculator (Maya) ---- */
const CARDS = [{n:"Target",b:640,r:.2995},{n:"Capital One",b:4870,r:.279},{n:"Discover",b:2150,r:.245}];
const minPay = b => b <= 0 ? 0 : Math.min(b, Math.max(25, b * 0.03));
function simCards(extra){ // extra: function(month) -> extra dollars that month beyond minimums
  const cs = CARDS.map(c => ({...c})); let interest = 0, yearly = [0], target = null, free = null; const series = [];
  for (let m = 0; m < 120; m++){
    cs.forEach(c => { const i = c.b * c.r / 12; c.b += i; interest += i; });
    let budget = extra ? 230 + extra(m) : Infinity;
    cs.forEach(c => { const p = Math.min(minPay(c.b), budget); c.b -= p; budget -= p; });
    if (extra) for (const c of cs.slice().sort((a,b) => b.r - a.r)){ if (budget <= 0) break; const p = Math.min(c.b, budget); c.b -= p; budget -= p; }
    const tot = cs.reduce((s,c) => s + Math.max(0,c.b), 0); series.push(tot);
    if (target === null && cs[0].b <= 0.5) target = m;
    if (free === null && tot <= 0.5) free = m;
    if ((m + 1) % 12 === 0) yearly.push(interest);
  }
  return {interest, yearly, target, free, series};
}

/* ================= Budget engine ================= */
function livingList(){ return S.living.length ? S.living : p().living; }
const sumType = t => livingList().filter(c => !t || c.type === t).reduce((s,c) => s + c.amt, 0);
const livingM = () => sumType();
const takeHomeM = () => monthly(S.pay || p().pay);
function payNow(){
  let pay = S.pay || p().pay;
  S.moves.forEach(m => { if (m.payCut && active(m)) pay -= S.dec[m.id] && S.dec[m.id].status === "adjusted" && m.payCutAlt ? m.payCutAlt : m.payCut; });
  return pay;
}
const billsPP = () => perPay(sumType("fixed"));
function spendPP(){ return perPay(sumType("need") + sumType("want")) - S.goals.filter(g => g.from === "spend").reduce((s,g) => s + g.pp, 0); }
function allocs(opts = {}){
  let avail = payNow() - billsPP() - spendPP();
  const out = [];
  S.moves.forEach(m => {
    if (!m.alloc || m.alloc.rest || !active(m)) return;
    const dc = S.dec[m.id]; const want = dc && dc.status === "adjusted" ? m.alloc.alt : m.alloc.want;
    const amt = Math.max(0, Math.min(want, avail)); out.push({label:m.alloc.label, amt, id:m.id}); avail -= amt;
  });
  if (!opts.noGoals) S.goals.forEach(g => { out.push({label:g.name, amt:g.pp, id:"goal"}); if (g.from === "rest") avail -= g.pp; });
  const rest = S.moves.find(m => m.alloc && m.alloc.rest && active(m));
  if (rest){
    const half = S.dec[rest.id] && S.dec[rest.id].status === "adjusted";
    const amt = Math.max(0, half ? avail / 2 : avail);
    out.push({label:rest.alloc.label, amt, id:rest.id}); avail -= amt;
  }
  if (avail > 5) out.push({label:"Extra in checking", amt:avail, id:"left"});
  return out;
}
const allocAmt = id => { const a = allocs().find(x => x.id === id); return a ? Math.round(a.amt) : 0; };
function splitNow(){
  return [["Bills", billsPP()], ...allocs().filter(a => a.amt > 0.5).map(a => [a.label, a.amt]), ["Yours to spend", spendPP()]];
}
function cardSim(goalsOverride){
  const goals = goalsOverride || S.goals;
  const restBase = allocs({noGoals:true}).find(a => a.id === "cards"); const R0 = restBase ? restBase.amt : 0;
  const cush = allocAmt("cushion"); const cm = cush ? Math.ceil((690 / cush) / PPM) : 0;
  return simCards(m => monthly(R0 + (m >= cm ? cush : 0) - goals.filter(g => g.from === "rest" && m < g.months).reduce((s,g) => s + g.pp, 0)));
}

/* ================= ROI ================= */
function curveAt(curve, y){
  if (curve === "comp") return (Math.pow(1.07, y) - 1) / (Math.pow(1.07, 10) - 1);
  if (curve === "debt") return Math.min(1, y / 1.5);
  if (curve === "late") return y <= 1.5 ? 0 : (Math.pow(1.07, y - 1.5) - 1) / (Math.pow(1.07, 8.5) - 1);
  return y / 10;
}
function roi(){
  const rows = S.moves.filter(m => m.value).map(m => {
    const dc = S.dec[m.id] || {status:"approved"}; const v = txt(m.value);
    if (dc.status === "skipped") return {m, v, amt:0, lost:v.amt || v.pending || 0, state:"skip"};
    if (v.pending) return {m, v, amt:0, pending:v.pending, state:"pend"};
    return {m, v, amt:dc.status === "adjusted" && v.alt ? v.alt : v.amt, state:"ok"};
  });
  const total = rows.reduce((s,r) => s + r.amt, 0);
  const years = Array.from({length:11}, (_,y) => rows.reduce((s,r) => s + (r.v.series ? (r.v.series[y] || 0) * (r.amt / Math.max(1, r.v.amt)) : r.amt * curveAt(r.v.curve || "lin", y)), 0));
  return {rows, total, years};
}

let voice = null, sayId = 0;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  const pref = ["Daniel","Aaron","Google UK English Male","Microsoft Andrew","Microsoft Guy","Alex","Evan","Tom","Fred"];
  for (const n of pref){ const v = vs.find(v => v.name.includes(n)); if (v){ voice = v; return; } }
  voice = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function setSpeaking(on){ $("#dwave").classList.toggle("speaking", on); $("#call").classList.toggle("speaking", on && S.inCall); }
function hush(){ sayId++; if ("speechSynthesis" in window) speechSynthesis.cancel(); setSpeaking(false); }
function saidEl(){ return S.inCall ? $("#csaid") : $("#said"); }
function speak(text){
  const el = saidEl(); const id = ++sayId;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  S.history.push({who:"Jeff", text});
  el.classList.remove("thinking"); el.textContent = ""; setSpeaking(true);
  const words = text.split(/\s+/);
  const useVoice = S.voice && "speechSynthesis" in window;
  let spoken = !useVoice;
  if (useVoice){
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice; u.rate = 1.05; u.pitch = .95;
    u.onend = u.onerror = () => { spoken = true; };
    speechSynthesis.speak(u);
    setTimeout(() => { spoken = true; }, words.length * 430 + 2500);
  }
  const per = useVoice ? 290 : 45;
  return new Promise(res => {
    let i = 0;
    const tick = () => {
      if (id !== sayId){ res(false); return; }
      if (i < words.length){ el.textContent += (i ? " " : "") + words[i++]; el.scrollTop = el.scrollHeight; setTimeout(tick, per); }
      else if (!spoken){ setTimeout(tick, 120); }
      else { setSpeaking(false); res(true); }
    };
    tick();
  });
}
function thinking(){ const el = saidEl(); el.classList.add("thinking"); el.textContent = "Jeff is thinking…"; }
function youSaid(t){ const el = S.inCall ? $("#cyou") : $("#you"); if (el) el.textContent = "You: " + t; S.history.push({who:"User", text:t}); }

  if (!pick && /\bno\b|nope|nah/i.test(text)) pick = q.opts.find(o => /^no/i.test(o));
  if (!pick && /yes|yeah|yep/i.test(text)) pick = q.opts[0];
  if (!pick){ if (!(await speak("Got it. Just so I get the plan right, which of these is closest?"))) return; return setChips(q.opts.map(o => ({label:o, fn:() => answerQ(o)}))); }

    `{"reply": string, "decision": "approve" | "decline" | "modify" | "discuss", "new_detail": string or null (only for modify; under 70 characters)}`);
  if (r && r.reply && r.decision){
    if (r.decision === "discuss"){ if (!(await speak(r.reply))) return; return moveChips(); }
    if (r.decision === "modify") return decide("modify", r.new_detail || "Adjusted to your request", r.reply);
    return decide(r.decision, null, r.reply);
  }
  if (RX.why.test(text)) return why();
  if (RX.no.test(text)) return decide("decline");
  if (RX.yes.test(text)) return decide("approve");
  if (RX.change.test(text) && m.alt) return change();
  if (!(await speak("Fair question. In the full product I'd dig into that with your live data. For now, want to go with this one, or tweak it?"))) return;
  moveChips();
}

const GOAL_RX = /(trip|fly|flight|wedding|baptism|vacation|coming up|save for|saving for|birthday|concert|festival|tickets|christmas|holiday|bachelor|graduation|need about|need \$|buy a|buying a)/i;
async function homeFree(text, onWorth, forceGoal){
  const d = p();
  if (!onWorth) addThread(`<div class="msg me"><span>${esc(text)}</span></div>`);
  if (S.pendingGoal) return goalFollow(text);
  thinking();
  let r = forceGoal ? null : await llm(`${d.first} just said: "${text}". Answer as Jeff. If they're describing something upcoming they need money for (a trip, an event, a purchase), fill "goal" with a short name, the amount if they said one, and how many months away if they said it, and keep reply to a short acknowledgment. Otherwise goal is null. If a chart would help, pick one: "spending", "paycheck", "debt"${d.hasCards ? "" : " (never: no debt)"}, "balances", or "worth". If they ask to change the plan, confirm the change in plain words.`,

  if (forceGoal || (r && r.goal) || (!r && GOAL_RX.test(text))){
    const g = (r && r.goal) || {};
    return startGoal({name:g.name || goalName(text), amount:g.amount || parseMoney(text), months:g.months || parseMonths(text), raw:text});
  }

    else if (/balance|account|net worth|how much/i.test(text)){ chart = "balances"; reply = "Here's everything you've got, as of this morning."; }
    else if (/change|update|instead|move|increase|decrease/i.test(text)){ reply = "Done. I've updated the plan and I'll route that way from your next paycheck."; }
    else reply = "Good question. In the live product I'd answer that from your real data. Try telling me about something coming up, or ask about your spending.";
    r = {reply, chart};
  }
  const ch = r.chart ? chartFor(r.chart) : "";
  if (!onWorth) addThread(`<div class="msg jf">${esc(r.reply)}${ch}</div>`);
  if (!(await speak(r.reply))) return;
  if (onWorth) return setChips([{label:"Start running my plan", fn:() => home()}]);

}

function goalName(t){

async function startGoal(g){
  S.pendingGoal = g;
  if (!g.amount){ if (!(await speak(`Love that. Roughly how much will ${g.name.toLowerCase()} cost you, all in?`))) return; return setChips(["$400","$1,000","$2,500"].map(v => ({label:v, fn:() => goalFollow(v)}))); }

  proposeGoal(g);
}
async function goalFollow(text){
  const g = S.pendingGoal; if (!g) return homeFree(text);
  if (!g.amount){ const n = parseMoney(text); if (!n){ await speak("Just a ballpark number is fine."); return; } g.amount = n; return startGoal(g); }
  if (!g.months){ const m = parseMonths(text) || (parseInt(text) || null); if (!m){ await speak("Roughly how many months from now?"); return; } g.months = m; return startGoal(g); }
}
function goalImpact(g, from){
  const pp = g.pp;
  if (from === "rest" && p().hasCards){
    const before = cardSim(); const after = cardSim([...S.goals, {...g, from:"rest"}]);
    const delayM = Math.max(0, after.free - before.free); const extraI = Math.max(1, after.interest - before.interest);
    return `I'd take ${fmt(pp)} a paycheck from your card payoff for ${g.paychecks} paychecks. Your living money doesn't change. Card-free ${delayM ? `moves about ${delayM} ${delayM === 1 ? "month" : "months"} later` : "stays on schedule"}, and it costs about ${fmt(extraI)} in extra interest.`;
  }
  if (from === "rest"){ const rest = S.moves.find(m => m.alloc && m.alloc.rest && ok(m.id)); return `I'd take ${fmt(pp)} a paycheck from your ${rest ? (rest.alloc.label === "Schwab" ? "Schwab money" : rest.alloc.label.toLowerCase()) : "extra savings"} for ${g.paychecks} paychecks. Your living money doesn't change, and everything else stays on track.`; }
  return `I'd take ${fmt(pp)} a paycheck out of your living money for ${g.paychecks} paychecks. Nothing else in the plan moves.`;
}
async function proposeGoal(g){
  g.paychecks = Math.max(1, Math.floor(g.months * PPM)); g.pp = Math.ceil(g.amount / g.paychecks);
  g.by = monthLabel(g.months).split(" ")[0] + " " + (new Date(2026, 9 + Math.round(g.months), 1)).getFullYear();
  const restOk = S.moves.some(m => m.alloc && m.alloc.rest && ok(m.id)) && allocAmt(S.moves.find(m => m.alloc && m.alloc.rest && ok(m.id)).id) >= g.pp;
  const want = livingList().filter(c => c.type === "want" && !/everything|breathing/i.test(c.name)).sort((a,b) => b.amt - a.amt)[0];
  const from = restOk ? "rest" : "spend";
  if (!(await speak(`Got it. ${fmt(g.amount)} for ${g.name.toLowerCase()} by ${g.by}. ${goalImpact(g, from)}${restOk ? ` Or I can take it from your ${want.name.toLowerCase()} money instead. What do you want?` : " What do you think?"}`))) return;
  const opts = [{label:"Sounds good", fn:() => commitGoal(g, from)}];
  if (restOk) opts.push({label:`Take it from ${want.name.toLowerCase()}`, fn:() => commitGoal(g, "spend", want)});
  opts.push({label:"Why that way?", fn:async () => { if (!(await speak(restOk ? "Because it keeps your day-to-day exactly the same. You won't feel this one at all, it just lands a little later on the long-term stuff. But it's your money, so you pick." : "Because there's no spare money elsewhere in the plan right now. Short term, this is the cleanest way to get you there without new debt."))) return; setChips(opts.filter(o => o.label !== "Why that way?")); }});
  opts.push({label:"Push it a month later", fn:() => { g.months += 1; proposeGoal(g); }});
  setChips(opts);
}
async function commitGoal(g, from, want){
  S.pendingGoal = null;
  const goal = {name:g.name, amount:g.amount, months:g.months, pp:g.pp, by:g.by, paychecks:g.paychecks, from, saved:0, fromLabel:from === "rest" ? "your plan's extra" : (want ? want.name.toLowerCase() : "living money")};
  S.goals.push(goal);

  addThread(`<div class="msg jf">Added to your plan: ${esc(goal.name)}, ${fmt(goal.pp)} a paycheck, ready by ${goal.by}.</div>`);
  if (!(await speak(`Done. ${goal.name} is in the plan. I'll set aside ${fmt(goal.pp)} every paycheck in its own bucket so you don't accidentally spend it, and I'll tell you the day it's ready.`))) return;

}

const ID_RULES = [[/checking/i,"chk"],[/^savings$|way2save|online savings/i,"sav"],[/venmo/i,"venmo"],[/quicksilver/i,"co"],[/discover/i,"disc"],[/target/i,"tgt"],[/student/i,"stu"],[/auto loan/i,"autoL"],[/gold/i,"amex"],[/401/,"k401"],[/roth/i,"roth"],[/brokerage/i,"schwab"]];

function moveMoney(from, to, amt, note){

/* allocations now carry a destination */
function allocs(opts = {}){
  let avail = payNow() - billsPP() - spendPP();
  const out = [];
  S.moves.forEach(m => {
    if (!m.alloc || m.alloc.rest || !active(m)) return;
    const dc = S.dec[m.id]; const want = dc && dc.status === "adjusted" ? m.alloc.alt : m.alloc.want;
    const amt = Math.max(0, Math.min(want, avail)); out.push({label:m.alloc.label, amt, id:m.id, to:m.alloc.to}); avail -= amt;
  });
  if (!opts.noGoals) S.goals.forEach(g => { out.push({label:g.name, amt:g.pp, id:"goal", to:"savings:" + g.name}); if (g.from === "rest") avail -= g.pp; });
  const rest = S.moves.find(m => m.alloc && m.alloc.rest && active(m));
  if (rest){
    const half = S.dec[rest.id] && S.dec[rest.id].status === "adjusted";
    const amt = Math.max(0, half ? avail / 2 : avail);
    out.push({label:rest.alloc.label, amt, id:rest.id, to:rest.alloc.to}); avail -= amt;
  }
  if (avail > 5) out.push({label:"Extra in checking", amt:avail, id:"left"});
  return out;
}

  const row = a => `<div class="acct">${logo(a.inst)}<div class="nm"><b>${acctName(a)}</b><span>${Object.keys(a.buckets || {}).length ? Object.entries(a.buckets).filter(([,v]) => v > 0.5).map(([k,v]) => `${k} ${fmt(v)}`).join(", ") : (a.rate || a.inst)}</span></div><div class="bal num"><span class="${a.bal < 0 ? "neg" : ""}">${fmt(a.bal)}</span></div></div>`;
  const grp = (t, l) => l.filter(a => Math.abs(a.bal) > 0.5 || a.id === "chk").length ? `<div class="group"><h4><span>${t}</span><span class="num">${fmt(sum(l))}</span></h4>${l.filter(a => Math.abs(a.bal) > 0.5 || a.id === "chk").map(row).join("")}</div>` : "";
  return `<div class="totals"><div><small>Cash and savings</small><b class="num">${fmt(sum(cash))}</b></div><div><small>${owed.length ? "You owe" : "Invested"}</small><b class="num ${owed.length ? "neg" : ""}">${fmt(owed.length ? -sum(owed) : sum(inv))}</b></div></div>
    ${grp("Cash and savings", cash)}${grp("Investments", inv)}${grp("Cards and loans", owed)}`;
}
function ledgerHTML(){
  const L = S.ledger || {earned:0,avoided:0,free:0,found:0}; const t = ledgerTotal();
  const parts = [["interest earned", L.earned],["interest avoided", L.avoided],["employer match", L.free],["found", L.found]].filter(x => x[1] > 0.5).map(x => `${fmt(x[1])} ${x[0]}`).join(", ");
  return `<button class="worth" id="worthBtn"><div><span>Since Oct 1, Jeff has made and saved you</span><b class="num">${fmt(t)}</b><span>${parts || "Day one. Jeff starts counting today."}</span></div><em>On track for ${fmt(r100(roi().total))}<br>over 10 years</em></button>`;
}
function homeHTML(){
  const d = p();
  const rts = routes().map(r => `<li>${esc(r.label)}<span>${esc(r.text)}</span></li>`).join("") || `<li>Nothing yet<span>Approve a move and it shows up here.</span></li>`;
  return `<div class="pad">
    <div class="hhead"><span class="hi">Hi, ${d.first}</span><span class="datepill" id="datePill">${S.date}</span></div>
    <section class="safe"><p class="lbl">Safe to spend</p><p class="big num" id="safe">${fmt(S.safe)}</p><p class="small">in ${esc(acctName(acct("chk")))} until your next paycheck, bills already set aside</p></section>
    <div id="ledgerBox">${ledgerHTML()}</div>
    <section class="hsec"><h3>Your money, and where it is</h3><div id="moneyBox">${moneyHTML()}</div></section>
    <section class="hsec"><h3>Coming up</h3><ul class="goals" id="goals">${goalsHTML()}</ul></section>
    <section class="hsec"><h3 id="foundH">${foundHead()}</h3><ul class="found" id="found">${foundHTML()}</ul></section>
    <section class="hsec"><h3>Every payday, ${S.autoRun === false ? "after you approve" : "with your okay"}</h3><ul class="handling" id="routesBox">${rts}</ul></section>
    <section class="hsec"><h3 id="splitH">Your next ${fmt(payNow())} paycheck, already split</h3><div id="splitBox">${splitHTML(splitNow())}</div></section>
    <section class="hsec"><h3>Recent moves</h3><ul class="activity" id="activity">${(S.moneyLog || []).map(x => `<li><time>${x.date}</time>${esc(x.text)}</li>`).join("")}<li><time>Oct 1</time>Plan started. Nothing moves without your okay.</li></ul></section>
    <section class="hsec thread" id="thread"></section>
  </div>`;
}
function goalsHTML(){
  if (!S.goals.length) return `<li><div class="gt"><span>Nothing yet</span></div><small>Tell Jeff about a trip, a wedding, anything coming up. He'll fit it in.</small></li>`;
  return S.goals.map(g => `<li><div class="gt"><span>${esc(g.name)}</span><span class="num">${fmt(g.saved)} of ${fmt(g.amount)}</span></div>
    <div class="bar"><i style="width:${Math.min(100, g.saved / g.amount * 100)}%"></i></div><small>${fmt(g.pp)} each payday from ${esc(acctName(acct("chk")))} into ${esc(resolveTo("savings:" + g.name).label)}, out of sight so it doesn't get spent. Ready by ${g.by}.</small></li>`).join("");
}
function repaintMoney(){
  const set = (id, h) => { const el = $(id); if (el) el.innerHTML = h; };
  set("#goals", goalsHTML()); set("#splitBox", splitHTML(splitNow())); set("#moneyBox", moneyHTML()); set("#ledgerBox", ledgerHTML());
  set("#routesBox", routes().map(r => `<li>${esc(r.label)}<span>${esc(r.text)}</span></li>`).join(""));
  const h = $("#splitH"); if (h) h.textContent = `Your next ${fmt(payNow())} paycheck, already split`;
  const b = $("#worthBtn"); if (b) b.onclick = () => worthFromHome();
}
const _home = home;
home = async function(silent){ if (!S.accts) initAccts(); const r = await _home(silent); const b = $("#worthBtn"); if (b) b.onclick = () => worthFromHome(); return r; };
function addFound(f){
  S.found.unshift({...f, date:S.date, fresh:true}); repaintFound();
  if (f.value && S.ledger){ S.ledger.found += f.per ? f.value / 12 : f.value; repaintMoney(); }
}
async function ensureHome(){
  if (S.screen === "home") return;
  const d = p();
  if (!S.accts) initAccts();
  if (!S.moves.length || S.mi < S.moves.length){
    if (!Object.keys(S.ans).length){ S.ans.income = "Confirmed"; d.questions.forEach(q => S.ans[q.id] = q.opts[0]); }
    if (!S.living.length) S.living = d.living.map(c => ({...c, orig:c.amt, amt:c.trim ? c.trim.to : c.amt, status:c.trim ? "trimmed" : null}));
    S.moves = d.moves.call(d, S.ans); S.dec = {};
    S.moves.forEach(m => { S.dec[m.id] = {status:"approved", rec:(m.kind === "new" || m.kind === "check") ? m.rec : null}; applyApproved(m); });
    S.mi = S.moves.length; S.autoRun = true;
  }
  await home(true);
}
async function commitGoal(g, from, want){
  S.pendingGoal = null;
  const goal = {name:g.name, amount:g.amount, months:g.months, pp:g.pp, by:g.by, paychecks:g.paychecks, from, saved:0, fromLabel:from === "rest" ? "your plan's extra" : (want ? want.name.toLowerCase() : "living money")};
  S.goals.push(goal);
  const dest = resolveTo("savings:" + goal.name).label;
  repaintMoney(); addActivity(`New goal: ${goal.name}, ${fmt(goal.amount)} by ${goal.by}`);
  addThread(`<div class="msg jf">Added to your plan: ${esc(goal.name)}. Each payday, ${fmt(goal.pp)} moves from ${esc(acctName(acct("chk")))} into ${esc(dest)}. Ready by ${goal.by}.</div>`);
  if (!(await speak(`Done. Every payday, ${fmt(goal.pp)} moves from your checking into ${dest}. It's your own account, just out of sight, so it never shows up as spending money. When it's time to book, tell me and I'll move it back to checking.`))) return;
  S.handler = homeFree; homeChips();
}
async function payday(){
  await ensureHome(); hush();
  const d = p(); const pay = payNow(); const rs = routes();
  const chk = acct("chk"); chk.bal += pay;
  S.moneyLog.unshift({date:S.date, text:`Paycheck of ${fmt(pay)} from ${d.payer} landed in ${acctName(chk)}`}); addActivity(`Paycheck of ${fmt(pay)} from ${d.payer} landed in ${acctName(chk)}`);
  if (S.autoRun === false){
    banner(`Paycheck landed: ${fmt(pay)}. Approve today's planned moves?`);
    repaintMoney();
    if (!(await speak(`Payday. ${fmt(pay)} just landed. Want me to make today's planned ${rs.length === 1 ? "move" : "moves"}? ${rs.map(r => r.text).join(". ")}.`))) return;
    const pick = await choose([{label:"Approve all", go:true, reply:"Done. Everything's where it should be."},{label:"Not this time", go:false, reply:"Okay. Nothing moved. It's all sitting in checking, and I'll check in tomorrow."}], "Payday moves");
    if (pick.go === false){ await speak(pick.reply); S.handler = homeFree; return; }
    rs.forEach(r => moveMoney("chk", r.to, r.amt)); accrue(); await speak(pick.reply || "Done."); S.handler = homeFree; return;
  }
  banner(`Paycheck landed: ${fmt(pay)}. Your approved moves are done.`);
  rs.forEach(r => moveMoney("chk", r.to, r.amt));
  accrue();
  const spend = spendPP(); const from = S.safe, to = S.safe + spend, el = $("#safe");
  for (let i = 1; i <= 20; i++){ await sleep(30); if (el) el.textContent = fmt(from + (to-from)*i/20); }
  S.safe = to;
  await speak(`Payday. ${fmt(pay)} just landed, and I made the moves you approved, nothing else. Bills are covered, and you've got ${fmt(to)} to spend until next time.`);
}
function accrue(){
  const L = S.ledger;
  S.accts.forEach(a => { const r = a.id === "hysa" ? RATES.hysa : a.id === "sav" ? RATES.sav : 0; if (r && a.bal > 0) L.earned += a.bal * r / 26; });
  if (p().hasCards){ const s = cardSim(); L.avoided += Math.max(0, (BASE.yearly[1] - s.yearly[1]) / 26); }
  const mm = S.moves.find(m => m.id === "match" && m.payCut && ok(m.id)); if (mm) L.free += p().salary * p().matchPct / 100 / 26 * (S.dec.match.status === "adjusted" ? 0.5 : 1);
  S.goals.forEach(g => g.saved = Math.min(g.amount, g.saved + g.pp));
  repaintMoney();
}
async function runEvent(ev){
  if (ev.if && !ev.if(S.dec, S.ans)) return;
  setDate(ev.date);
  if (ev.kind === "payday") return payday();
  if (ev.kind === "call") return pull();
  if (ev.kind === "creep") return creep();
  hush(); banner(ev.text);
  if (ev.kind === "auto"){ if (ev.found) addFound({text:ev.found, value:ev.value}); await speak(ev.text); return; }
  if (ev.kind === "win"){ addActivity(ev.act); addFound({text:ev.act}); await speak(ev.text); return; }
  if (ev.kind === "text"){
    if (!(await speak(ev.text))) return;
    const pick = await choose(ev.chips, ev.text);
    if (pick.move) moveMoney(pick.move.from, pick.move.to, pick.move.amt);
    if (pick.found){ addFound({text:pick.found, value:pick.value, per:pick.per}); }
    repaintMoney();
    await speak(pick.reply);
    S.handler = homeFree;
  }
}
const _reset = resetPersona;
resetPersona = function(){ _reset(); S.accts = null; S.ledger = null; S.moneyLog = []; S.autoRun = null; };

/* ---------- Live AI: Claude viewer, or the app's own /api/jeff when hosted elsewhere (Base44) ---------- */
let hostAI = null;
if (!(window.claude && window.claude.use) && typeof fetch === "function") fetch("/api/health").then(r => r.ok ? r.json() : null).then(j => { hostAI = !!(j && j.ai); liveAI = hostAI; paintAI(); }).catch(() => {});
async function llm(task, schema){
  const recent = S.history.slice(-8).map(h => `${h.who}: ${h.text}`).join("\n");
  const prompt = `${STYLE}\n\nPERSON'S DATA\n${profileText()}\n\nRECENT CONVERSATION\n${recent || "(none)"}\n\nTASK\n${task}\n\nReturn only JSON, no code fences, matching: ${schema}`;
  if (hostAI){
    try { const r = await fetch("/api/jeff", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt})}); if (!r.ok) return null; const j = await r.json(); return j && Object.keys(j).length ? j : null; } catch(e){ return null; }
  }
  const s = await Promise.race([getSampler(), sleep(3500).then(() => null)]);
  if (!s) return null;
  try { return await s.json(prompt, {modelTier:"quick", cache:false}); }
  catch(e){ if (e && e.code === "not_granted"){ liveAI = false; paintAI(); } return null; }
}

paintControls(); paintAI(); getSampler(); welcome();

</script>
